<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>Pokemon World - Dev Mode</title>
      <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
      <style>
         body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
         }
         #game-container {
            width: 100vw;
            height: 100vh;
         }
         #dev-controls {
            backdrop-filter: blur(3px);
            border: 1px solid #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
         }
         #dev-controls select, #dev-controls button, #dev-controls input[type="range"] {
            font-family: inherit;
            font-size: 12px;
         }
      </style>
   </head>
   <body>
      <div id="game-container"></div>
      <div id="dev-controls-root"></div>
   </body>
   </html>
