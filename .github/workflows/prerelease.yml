name: Pre-release

# Pushing a semver tag (v1.2.3, v1.2.3-rc.1) builds it and publishes a GitHub
# pre-release with generated notes. Nothing is deployed until the release is
# promoted to Latest (see deploy.yml).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate semver tag
        run: |
          # Tag filters are globs; enforce strict semver here.
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semver tag (vMAJOR.MINOR.PATCH[-pre][+build])"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (bun test)
        run: bun run test

      - name: Build
        run: bun run build

      # Server bundles are environment-independent; the client is built at deploy
      # time against the stack's URLs.
      - name: Create pre-release
        run: |
          assets="apps/server/dist/server.js apps/auth/dist/auth.js"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release drafted in the UI (which also pushes the tag): just attach assets.
            gh release upload "$TAG" $assets --clobber
          else
            gh release create "$TAG" $assets --verify-tag --prerelease --generate-notes --title "$TAG"
          fi
