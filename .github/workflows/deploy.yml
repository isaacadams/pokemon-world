name: Deploy Pokemon World

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name (e.g., dev, production)"
        required: true
        default: "dev"
      deploy_infra:
        description: "Run CDK deploy to update infra (idempotent)"
        required: true
        default: "true"
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT_NAME: ${{ inputs.environment || 'dev' }}
      # The stack is pinned to us-east-1 (region-specific AMI, VPC and subnet).
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Optionally deploy/update infrastructure (CDK)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_infra == 'true') || (github.event_name == 'push') }}
        working-directory: infra
        run: |
          # Idempotent: only updates if there are changes.
          bunx cdk deploy \
            --require-approval never \
            -c environmentName=${{ env.ENVIRONMENT_NAME }} \
            -c vpcId=${{ secrets.VPC_ID }} \
            -c subnetId=${{ secrets.SUBNET_ID }}

      # Uploads server/auth bundles to S3, installs them via SSM Run Command, then syncs the client.
      - name: Release servers and client
        run: bun run release
