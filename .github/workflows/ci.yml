name: Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (bun test)
        run: bun run test

      - name: Build client
        run: bun run --filter @pokemon-world/game build

      - name: Synthesize infrastructure (CDK)
        run: bun run --filter @repo/infra synth
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"

  dst-playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/dst
        run: bunx playwright install --with-deps

      - name: Run DST headless Playwright tests
        run: bun run test:dst

  e2e-playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: test
        run: bunx playwright install --with-deps

      - name: Run root E2E Playwright tests
        run: bun run test:e2e
