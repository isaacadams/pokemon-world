name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (bun test)
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Synthesize infrastructure (CDK)
        run: bun run --filter @repo/infra synth
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"

  dst-playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/dst
        run: bunx playwright install --with-deps chromium webkit

      - name: Run DST headless Playwright tests
        run: bun run test:dst

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dst-test-results
          path: packages/dst/test-results/
          retention-days: 7

  e2e-playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: test
        run: bunx playwright install --with-deps chromium

      - name: Run root E2E Playwright tests
        run: bun run test:e2e

      # Includes actual/expected/diff images when a screenshot test fails.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            test/test-results/
            test/playwright-report/
          retention-days: 7
